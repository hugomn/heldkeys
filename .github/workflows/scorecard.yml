# OpenSSF Scorecard: scores this repository's supply-chain practices and
# publishes the result so the README badge and scorecard.dev show it.
#
# Read-only except where the scorecard action needs more: `id-token: write`
# signs the published result (that is what the badge reads), and
# `security-events: write` uploads the findings to code scanning. No secrets,
# and the checkout keeps no credentials.

name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "37 6 * * 1"

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the repository and its releases
      actions: read # read workflow runs for the CI checks
      id-token: write # sign the published result that the badge reads
      security-events: write # upload the findings to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
