# Publishes the heldkeys crate to crates.io. Called by release.yml (a cargo-dist
# custom publish job, see publish-jobs in dist-workspace.toml) after the GitHub
# release is up, never on its own.
#
# There is no stored crates.io token. crates.io Trusted Publishing trusts this
# repository and workflow, and rust-lang/crates-io-auth-action trades the job's
# GitHub OIDC token for a crates.io token that lives about 30 minutes and is
# revoked when the job ends.

name: Publish to crates.io

on:
  workflow_call:
    inputs:
      # The dist manifest of the release, passed by release.yml. Unused here:
      # the version comes from Cargo.toml at the tagged commit.
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the GitHub OIDC token that Trusted Publishing exchanges.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Re-running a release must not fail because the crate is already up:
      # ask crates.io first and skip the rest when this version exists.
      - name: Check whether this version is already on crates.io
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "heldkeys") | .version')
          echo "Cargo.toml version: ${version}"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user-agent 'heldkeys release workflow (github.com/hugomn/heldkeys)' \
            "https://crates.io/api/v1/crates/heldkeys/${version}")
          case "$status" in
            200)
              echo "heldkeys ${version} is already on crates.io, nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io answered HTTP ${status} for heldkeys ${version}"
              exit 1
              ;;
          esac

      - name: Get a short-lived crates.io token
        if: steps.check.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: cargo publish
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
