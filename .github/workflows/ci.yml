name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The tests never need the metadata probe; keep CI runs offline-equivalent.
  HELDKEYS_NO_NET: "1"

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo test --locked

  msrv:
    name: minimum supported Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - run: cargo check --all-targets --locked

  # heldkeys and zizmor on this repository's own workflows. heldkeys is built
  # from the commit under test, so the job also checks the current code.
  heldkeys:
    name: heldkeys ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo build --locked --release
      - name: Run heldkeys ci
        run: |
          ./target/release/heldkeys ci --format markdown --fail-on none --output "$RUNNER_TEMP/heldkeys.md"
          cat "$RUNNER_TEMP/heldkeys.md" >> "$GITHUB_STEP_SUMMARY"
          ./target/release/heldkeys ci --fail-on high

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows action.yml
          version: 1.31.1
          advanced-security: false

  # No credential-shaped strings in the tracked files: fake test credentials
  # are split in Rust and written as {{fake:...}} markers in tests/fixtures.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          asset=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$RUNNER_TEMP/$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$asset"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the tracked files
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/tree"
          mkdir -p "$tree"
          git archive HEAD | tar -x -C "$tree"
          "$RUNNER_TEMP/gitleaks" dir "$tree" --no-banner --redact

  # HOL's plugin scanner, the check behind the awesome-ai-plugins catalog and
  # the hol.org trust score. The action runs with read access only, no secrets,
  # no network probing, and installs a scanner wheel it verifies against a
  # committed SHA-256 and PyPI provenance.
  hol-scanner:
    name: HOL plugin scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@8db741c699f3554e9c7f4947e8954f9190332e6b # v1.2.801
        with:
          plugin_dir: "."
          min_score: 100
          fail_on_severity: none

  # The parsers heldkeys points at untrusted files, fuzzed for a short while on
  # every push (see fuzz/). A crash here is a bug in a parser, not flakiness:
  # each target only feeds bytes to a function that must return or error.
  fuzz:
    name: fuzz (short runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - name: Build the fuzz targets
        run: cargo +nightly fuzz build
      - name: Run each target for 20 seconds
        run: |
          for target in yaml config_formats report text_rules; do
            cargo +nightly fuzz run "$target" -- -max_total_time=20
          done
